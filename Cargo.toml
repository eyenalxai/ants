[package]
name = "ants"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.17.2" }
fastrand = "2.3.0"
# Bevy pulls `log` in transitively; these features cap runtime log levels:
# debug and below in dev builds, warn and below in release builds.
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }

[features]
# Opt-in dynamic linking for faster iterative builds:
# `cargo run --features dynamic_linking`.
dynamic_linking = ["bevy/dynamic_linking"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
